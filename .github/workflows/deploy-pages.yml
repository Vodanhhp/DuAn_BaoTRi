name: Deploy BAOTRI Mini to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Cloud sync mapping safety
        run: npm run test:sync-mapping

      - name: Test Local identity rekey safety
        run: npm run test:local-identity

      - name: Validate template release JSON Schema
        run: npx --yes ajv-cli@5 validate -s docs/schemas/baotri-template-release.schema.json -d templates/HOTEL_SMALL_BASIC/1.0.0.json --spec=draft2020 --all-errors

      - name: Test template release references
        run: npm run test:template-release

      - name: Validate hotel template package
        run: npm run validate:template

      - name: Generate shared 247 favicon and PWA icons
        run: |
          python -m pip install pillow
          python scripts/generate-brand-icons.py

      - name: Build Vite app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Preserve custom domain
        run: cp CNAME dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
