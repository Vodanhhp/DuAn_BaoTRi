name: BAOTRI Mini CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baotri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: |
          npm run test:sync-mapping
          npm run test:local-identity
          npm run test:template-release
          npm run test:date-utils
          npm run test:backup-validation
          npm run test:local-concurrency
          npm run test:cloud-asset-import

      - name: Validate template release
        run: npm run validate:template

      - name: Build production bundle
        run: npm run build
